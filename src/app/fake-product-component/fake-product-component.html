<p>fake-product works!</p>
<p>{{errMessage()}}</p>
<h3 class="text-center text-white bg-dark p-3">Product List</h3>

<div class="container mt-4">
  <div class="row">
    <!-- Vòng lặp bọc lấy toàn bộ card -->
    <div class="col-md-4 mb-4" *ngFor="let p of products()">
      <div class="card h-100 p-2 shadow-sm">
        
        <div class="img-container">
          <div class="d-flex justify-content-between align-items-center p-2 first">
            <span class="percent">-25%</span>
            <span class="wishlist"><i class="bi bi-heart-fill"></i></span>
          </div>
          <div class="text-center p-3">
            <img [src]="p.image" class="img-scale" [alt]="p.title" style="height: 200px; object-fit: contain;">
          </div>
        </div>

        <div class="product-detail-container mt-auto">
          <div class="d-flex justify-content-between align-items-center">
            <h6 class="mb-0 text-truncate" [title]="p.title">{{p.title}}</h6>
          </div>
          <div class="mt-1">
            <span class="text-danger fw-bold">${{p.price}}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <div class="ratings">
              <i class="bi bi-star-fill text-warning me-1"></i>
              <span>{{p.rating?.rate}}</span>
            </div>
            <div class="count">
              Count: {{p.rating?.count}}
            </div>
          </div>
          <div class="mt-3">
            <button class="btn btn-warning d-block w-100 text-white fw-bold">Buy Now</button>
          </div>
        </div>

      </div>
    </div> <!-- Đóng thẻ col-md-4 ở đây mới đúng -->
  </div>
</div>
